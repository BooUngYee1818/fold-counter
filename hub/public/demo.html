<title>폴더블 카운터 체험</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Archivo+Black&display=swap">
<style>
  :root {
    --bg: #eef0f6; --panel: #ffffff; --ink: #14161c; --muted: #5b6170; --line: #d8dbe6;
    --accent: #1484b8; --accent-ink: #ffffff; --ok: #0faa5c; --warn: #d79b00; --bad: #d9443a;
    --stage: #0b0c10; --stage-2: #15171f; --chip: #e6e9f2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117; --panel: #171a22; --ink: #eef0f6; --muted: #9aa1b4; --line: #2a2f3d;
      --accent: #4fc3f7; --accent-ink: #06202c; --ok: #00e676; --warn: #ffc107; --bad: #ff5252;
      --stage: #06070a; --stage-2: #101218; --chip: #232736;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117; --panel: #171a22; --ink: #eef0f6; --muted: #9aa1b4; --line: #2a2f3d;
    --accent: #4fc3f7; --accent-ink: #06202c; --ok: #00e676; --warn: #ffc107; --bad: #ff5252;
    --stage: #06070a; --stage-2: #101218; --chip: #232736;
  }
  body { background: var(--bg); color: var(--ink); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 64px; padding-inline: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; margin-bottom: 18px; }
  h1 { font-size: clamp(24px, 3.4vw, 34px); font-weight: 900; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
  .sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
  .lang button { border: 0; background: transparent; color: var(--muted); padding: 8px 16px; font: inherit; font-weight: 700; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .panel h2 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 700; }
  /* ---- 폰 ---- */
  .stage { background: var(--stage); border-radius: 14px; padding: 26px 16px; display: flex; justify-content: center; align-items: center; min-height: 380px; }
  .phone { position: relative; height: 300px; aspect-ratio: 1.2; max-width: 100%; border-radius: 26px; background: #000; border: 6px solid #2a2b31; box-shadow: 0 0 0 2px #101115, 0 20px 50px rgba(0,0,0,.6); transition: aspect-ratio .55s cubic-bezier(.2,.8,.2,1), width .55s; overflow: hidden; container-type: size; }
  .phone.cover { aspect-ratio: 0.516; }
  .phone .hinge { position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; background: rgba(255,255,255,.08); transition: opacity .3s; }
  .phone.cover .hinge { opacity: 0; }
  .phone .name { position: absolute; top: 5cqh; left: 0; right: 0; text-align: center; color: #9e9e9e; font-size: clamp(9px, 4.5cqw, 15px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 8px; }
  .phone .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", "Arial Black", sans-serif; color: #fff; font-size: min(62cqh, 60cqw); line-height: 1; transition: transform .2s; }
  .phone .num.pop { transform: scale(1.12); }
  .phone .status { position: absolute; left: 10px; bottom: 7px; right: 10px; display: flex; align-items: center; gap: 6px; color: #616161; font-size: clamp(7px, 3cqw, 11px); white-space: nowrap; overflow: hidden; }
  .phone .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .phone .credit { position: absolute; top: 14cqh; left: 50%; transform: translateX(-50%); background: rgba(17,17,17,.8); border: 1px solid rgba(255,255,255,.2); border-radius: 12px; padding: 8px 14px; color: #fff; text-align: center; font-size: clamp(8px, 3.4cqw, 12px); white-space: nowrap; }
  .phone .credit small { display: block; color: #9e9e9e; }
  .phone.half .num { opacity: .35; }
  .posture { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--chip); font-size: 13px; font-weight: 700; }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .pill.open i { background: var(--ok); } .pill.closed i { background: var(--bad); } .pill.half i { background: var(--warn); }
  .controls { margin-top: 14px; display: grid; gap: 12px; }
  .slider { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  button.b { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  button.b.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.b:focus-visible, .lang button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { color: var(--muted); font-size: 13px; margin-top: 10px; }
  .rule { font-size: 13px; color: var(--muted); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-top: 6px; }
  .rule b { color: var(--ink); display: block; font-variant-numeric: tabular-nums; }
  /* ---- 라이브 ---- */
  .yt { background: var(--stage); border-radius: 14px; overflow: hidden; border: 1px solid #1f2230; }
  .player { position: relative; aspect-ratio: 16/9; background: radial-gradient(120% 90% at 70% 110%, #2a3350 0%, #0e1119 55%, #06070a 100%); overflow: hidden; }
  .player .desk { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, rgba(60,45,30,.0), rgba(90,65,40,.55)); }
  .player .bgimg { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .player .minis { position: absolute; right: 10px; bottom: 36px; width: 38%; display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px 6px; justify-items: center; align-items: end; }
  .mini { width: 100%; aspect-ratio: 1.2; border-radius: 6px; background: #000; border: 1.5px solid #34353c; box-shadow: 0 3px 12px rgba(0,0,0,.65); position: relative; overflow: hidden; transition: width .4s cubic-bezier(.2,.8,.2,1), aspect-ratio .4s; display: flex; align-items: center; justify-content: center; container-type: size; }
  .mini.cover { width: 40%; }
  .mini.flip.cover { width: 56%; aspect-ratio: 1; }
  .mini .mn { position: absolute; top: 2px; left: 0; right: 0; text-align: center; color: #9e9e9e; font-size: clamp(5px, 8.5cqw, 8px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 3px; }
  .mini .mc { font-family: "Archivo Black", "Arial Black", sans-serif; color: #fff; font-size: min(62cqh, 58cqw); line-height: 1; transition: transform .2s; margin-top: 4px; }
  .mini .mc.pop { transform: scale(1.2); }
  .mini .hl { position: absolute; left: 50%; top: 3px; bottom: 3px; width: 1px; background: rgba(255,255,255,.1); }
  .ovcredit img { height: 2.4em; width: auto; vertical-align: middle; margin-right: .35em; }
  label.b { display: inline-flex; align-items: center; }
  .player .live { position: absolute; top: 12px; right: 12px; background: #e62117; color: #fff; font-weight: 900; font-size: 12px; padding: 4px 9px; border-radius: 6px; letter-spacing: .05em; }
  .player .viewers { position: absolute; top: 12px; right: 76px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 4px 9px; border-radius: 6px; }
  .overlay { position: absolute; left: 14px; top: 12px; font-family: "Noto Sans KR", "Segoe UI", sans-serif; font-weight: 900; color: #fff; font-size: clamp(16px, 3.2vw, 34px); line-height: 1.15; -webkit-text-stroke: 0.07em #000; paint-order: stroke fill; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
  .overlay .c { display: inline-block; transition: transform .2s; }
  .overlay .c.pop { transform: scale(1.3); }
  .overlay .row.off { opacity: .5; }
  .ovcredit { position: absolute; right: 12px; bottom: 10px; color: #fff; font-size: clamp(9px, 1.4vw, 13px); text-align: right; -webkit-text-stroke: 0.05em #000; paint-order: stroke fill; font-weight: 700; line-height: 1.2; opacity: .92; }
  .ovcredit small { display: block; font-weight: 500; font-size: .85em; }
  .ytbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--stage-2); color: #ddd; font-size: 13px; }
  .ytbar .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #f7931e, #e8541f); flex: none; }
  .ytbar b { color: #fff; }
  .chat { display: grid; gap: 6px; padding: 10px 12px 12px; background: var(--stage-2); border-top: 1px solid #1f2230; font-size: 13px; color: #cfd3df; max-height: 150px; overflow: hidden; }
  .chat span b { color: #8ab4f8; margin-right: 6px; }
  .devs { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  /* ---- 실제 캡처 ---- */
  .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .shots { grid-template-columns: 1fr; } }
  .shot { background: var(--stage); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .shot img { max-height: 320px; width: auto; max-width: 100%; border-radius: 10px; border: 1px solid #2a2b31; }
  .shot figcaption { color: #aab; font-size: 13px; text-align: center; }
  .faq { display: grid; gap: 10px; }
  .faq div { padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--chip); border-radius: 0 10px 10px 0; }
  .faq b { display: block; margin-bottom: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
    </div>
    <div class="lang" role="group" aria-label="language">
      <button id="langKo" aria-pressed="true">한국어</button>
      <button id="langEn" aria-pressed="false">English</button>
    </div>
  </header>

  <div class="grid">
    <section class="panel">
      <h2 data-i="phoneTitle"></h2>
      <div class="stage">
        <div class="phone" id="phone">
          <div class="hinge"></div>
          <div class="name" id="pName">Galaxy Z Fold7</div>
          <div class="num" id="pNum">0</div>
          <div class="credit" id="pCredit" hidden><span data-i="appName"></span><small id="pCreditBy"></small></div>
          <div class="status"><span class="dot"></span><span id="pStatus"></span></div>
        </div>
      </div>
      <div class="posture">
        <span class="pill open" id="pill"><i></i><span id="pillText"></span></span>
        <span class="pill"><span data-i="angleLbl"></span>&nbsp;<b id="angleVal">180°</b></span>
        <span class="pill"><span data-i="screenLbl"></span>&nbsp;<b id="screenVal"></b></span>
      </div>
      <div class="controls">
        <div class="slider">
          <span data-i="closedLbl"></span>
          <input type="range" id="angle" min="0" max="180" value="180" step="1" aria-label="hinge angle">
          <span data-i="openLbl"></span>
        </div>
        <div class="btns">
          <button class="b primary" id="btnFold"></button>
          <button class="b" id="btnAuto"></button>
          <button class="b" id="btnIdle"></button>
          <button class="b" id="btnReset"></button>
        </div>
        <div class="rule">
          <span data-i="ruleClosed"></span><span data-i="ruleHalf"></span><span data-i="ruleOpen"></span>
        </div>
        <p class="note" data-i="phoneNote"></p>
      </div>
    </section>

    <section class="panel">
      <h2 data-i="liveTitle"></h2>
      <div class="yt">
        <div class="player">
          <div class="bgimg" id="bgimg"></div>
          <div class="desk"></div>
          <div class="minis" id="minis"></div>
          <div class="viewers">👁 1,284</div>
          <div class="live">LIVE</div>
          <div class="overlay" id="overlay"></div>
          <div class="ovcredit" id="ovCredit"><img id="ovLogo" alt="" hidden><span data-i="appName"></span><small id="ovBy"></small></div>
        </div>
        <div class="ytbar"><div class="av"></div><div><b data-i="streamTitle"></b><br><span data-i="streamer"></span></div></div>
        <div class="chat" id="chat"></div>
      </div>
      <div class="devs">
        <button class="b primary" id="btnAdd"></button>
        <button class="b" id="btnRemove"></button>
        <label class="b" id="bgLabel"><span data-i="bgBtn"></span><input type="file" id="bgFile" accept="image/*" hidden></label>
        <label class="b" id="logoLabel"><span data-i="logoBtn"></span><input type="file" id="logoFile" accept="image/*" hidden></label>
        <button class="b" id="btnBgReset"></button>
      </div>
      <p class="note" data-i="liveNote"></p>
    </section>
  </div>

      faqTitle: "자주 묻는 것", q1: "접혀 있는 동안에도 세나요?", a1: "네. 감지는 화면이 아니라 뒤에서 도는 서비스가 하기 때문에 화면이 꺼져 있어도 셉니다. 숫자는 '접힘 → 펼침' 순간에 올라갑니다.",
      q2: "커버 화면에 숫자가 꼭 나오나요?", a2: "폰 설정에 달려 있습니다. 갤럭시 폴드는 설정 › 디스플레이 › '커버 화면에서 앱 사용 유지', 갤럭시 플립은 설정 › 유용한 기능 › 실험실 › '커버 화면에서 앱 실행', 픽셀 폴드는 '접었을 때 화면 전환'에서 이 앱을 허용하면 됩니다. 설정이 꺼져 있으면 커버 화면에는 안 나오지만 카운트는 계속 됩니다.",

    },
    en: {
      title: "Fold Counter Demo", sub: "No foldable phone? Try the app's behavior right here. Fold and unfold the phone on the left and the live-stream caption on the right follows the exact same rules as the real app.",

      appName: "Fold Counter", creditBy: "made by YouTube @CEO_BooungYee-TeCh",

      angleLbl: "Hinge angle", screenLbl: "Showing on", inner: "inner screen", cover: "cover screen",
      closedLbl: "Closed 0°", openLbl: "Open 180°",
      fold: "Fold", unfold: "Unfold", auto: "Auto-fold 10 times", stop: "Stop", idle: "Show credit", idleOff: "Hide credit", reset: "Reset to 0",
      postureOpen: "Open", postureHalf: "Half open (not counted)", postureClosed: "Closed",
      ruleClosed: "<b>≤ 30°</b>counts as closed", ruleHalf: "<b>31° – 149°</b>half open, not counted", ruleOpen: "<b>≥ 150°</b>open; +1 if it was closed",
      phoneNote: "Drag the slider all the way left to fold, then all the way right to unfold: the count goes up by one. While folded the phone switches to the cover-screen size and keeps showing the number (when 'continue apps on cover screen' is enabled on the phone).",
      streamTitle: "Galaxy Z Fold7 — 10,000 fold challenge 🔥", streamer: "Live now · using Fold Counter",
      add: "Add device", remove: "Remove device", bgBtn: "Set stream background", logoBtn: "Set logo", bgReset: "Default background", liveNote: "Any number of phones can connect. Each added device adds a caption line and a small phone screen stacked in a 3-column grid at the bottom right; added devices fold and unfold on their own. Use 'Set stream background' to try your own stream frame and 'Set logo' for a logo (green screen removed automatically). Images stay in this page and are never uploaded.",
      shotsTitle: "Real app captures (Android 16 foldable emulator)", shotOpen: "Unfolded · inner screen (2208×1840)", shotFolded: "Folded · cover screen (1080×2092) — same number, still visible",
      shotsNote: "The device name reads sdk_gphone64_arm64 because this is an emulator. On a real phone the product name, e.g. Galaxy Z Fold7, is filled in automatically.",
      faqTitle: "Common questions", q1: "Does it count while the phone is folded?", a1: "Yes. Detection runs in a background service, not on the screen, so it keeps working with the screen off. The number goes up at the closed → open moment.",
      q2: "Will the number always show on the cover screen?", a2: "That depends on the phone's settings. Galaxy Fold: Settings › Display › 'Continue apps on cover screen'. Galaxy Flip: Settings › Advanced features › Labs › 'Apps allowed on cover screen'. Pixel Fold: 'Swap screens' when folding. If it is off, the cover screen stays blank but counting continues.",

  let lang = "ko";
  try { lang = localStorage.getItem("fc-demo-lang") || ((navigator.language || "ko").toLowerCase().startsWith("ko") ? "ko" : "en"); } catch (e) {}
  const T = () => I18N[lang];
  const $ = (id) => document.getElementById(id);

  // ---- 상태 (실제 앱과 같은 규칙) ----
  const CLOSED_T = 30, OPEN_T = 150;
  let count = 0, angle = 180, armed = false, posture = "open", lastCountAt = 0;
  const EXTRA = [["Galaxy Z Flip7", true], ["Pixel 10 Pro Fold", false], ["OnePlus Open", false], ["Surface Duo 2", false], ["motorola razr 60", true], ["HONOR Magic V3", false], ["Xiaomi MIX Fold 4", false], ["Galaxy Z Fold6", false]]; // 이름, 플립형 여부
  let extras = []; // {name, flip, count, fold, timer}
  let autoTimer = null, idleShown = false;

  function setPosture(a) {
    angle = a;
    const p = a <= CLOSED_T ? "closed" : (a >= OPEN_T ? "open" : "half");
    if (p === "closed" && !armed) armed = true;
    if (p === "open" && armed) {
      const now = Date.now();
      if (now - lastCountAt >= 300) { armed = false; lastCountAt = now; count++; pop($("pNum")); pop(document.getElementById("mc_0")); bumpChat(); }
    }
    posture = p;
    render();
  }
  function pop(el) { if (!el) return; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); setTimeout(() => el.classList.remove("pop"), 220); }

  function render() {
    const t = T();
    document.querySelectorAll("[data-i]").forEach((el) => { const k = el.dataset.i; if (t[k] !== undefined) el.innerHTML = t[k]; });
    $("langKo").setAttribute("aria-pressed", lang === "ko"); $("langEn").setAttribute("aria-pressed", lang === "en");
    $("pStatus").textContent = t.status; $("pCreditBy").textContent = t.creditBy; $("ovBy").textContent = t.creditBy;
    $("pNum").textContent = count;
    const phone = $("phone");
    phone.classList.toggle("cover", posture === "closed");
    phone.classList.toggle("half", posture === "half");
    $("angleVal").textContent = angle + "°";
    $("angle").value = angle;
    $("screenVal").textContent = posture === "closed" ? t.cover : t.inner;
    const pill = $("pill"); pill.className = "pill " + posture;
    $("pillText").textContent = posture === "open" ? t.postureOpen : (posture === "closed" ? t.postureClosed : t.postureHalf);
    $("btnFold").textContent = posture === "closed" ? t.unfold : t.fold;
    $("btnAuto").textContent = autoTimer ? t.stop : t.auto;
    $("btnIdle").textContent = idleShown ? t.idleOff : t.idle;
    $("btnReset").textContent = t.reset;
    $("btnAdd").textContent = `${t.add} (+)`; $("btnAdd").disabled = extras.length >= EXTRA.length;
    $("btnRemove").textContent = t.remove; $("btnRemove").disabled = extras.length === 0;
    $("btnBgReset").textContent = t.bgReset;
    $("pCredit").hidden = !idleShown; $("pName").hidden = idleShown;
    // 자막
    const rows = [{ name: "Galaxy Z Fold7", count, fold: posture === "closed", flip: false }, ...extras];
    $("overlay").innerHTML = rows.map((d, i) => `<div class="row">${d.name} <span class="c" id="ov_${i}">${d.count}</span></div>`).join("");
    // 오른쪽 아래 작은 폰 화면들 (3열)
    const minis = $("minis");
    const html = rows.map((d, i) => `<div class="mini${d.flip ? " flip" : ""}${d.fold ? " cover" : ""}" data-i-dx="${i}"><div class="hl"></div><div class="mn">${d.name}</div><div class="mc" id="mc_${i}">${d.count}</div></div>`).join("");
    if (minis.dataset.sig !== html) { minis.innerHTML = html; minis.dataset.sig = html; }
  }

  // 슬라이더/버튼
  $("angle").addEventListener("input", (e) => { stopAuto(); setPosture(Number(e.target.value)); });
  function animateTo(target, ms, done) {
    const from = angle, t0 = performance.now();
    function step(now) {
      const u = Math.min(1, (now - t0) / ms), eased = 1 - Math.pow(1 - u, 3);
      setPosture(Math.round(from + (target - from) * eased));
      if (u < 1) requestAnimationFrame(step); else if (done) done();
    }
    requestAnimationFrame(step);
  }
  $("btnFold").addEventListener("click", () => { stopAuto(); animateTo(posture === "closed" ? 180 : 0, 450); });
  function stopAuto() { if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; render(); } }
  $("btnAuto").addEventListener("click", () => {
    if (autoTimer) { stopAuto(); return; }
    let left = 10;
    const cycle = () => { if (left-- <= 0) { autoTimer = null; render(); return; } animateTo(0, 420, () => { autoTimer = setTimeout(() => animateTo(180, 420, () => { autoTimer = setTimeout(cycle, 350); }), 250); }); };
    autoTimer = setTimeout(cycle, 0); render();
  });
  $("btnIdle").addEventListener("click", () => { idleShown = !idleShown; render(); });
  $("btnReset").addEventListener("click", () => { count = 0; extras.forEach((d) => { d.count = 0; }); render(); });
  function scheduleExtra(d) {
    d.timer = setTimeout(() => {
      d.fold = true; render();
      d.timer = setTimeout(() => {
        d.fold = false; d.count++; render();
        const idx = extras.indexOf(d) + 1;
        pop(document.getElementById("mc_" + idx)); pop(document.getElementById("ov_" + idx));
        scheduleExtra(d);
      }, 650);
    }, 2200 + Math.random() * 2800);
  }
  $("btnAdd").addEventListener("click", () => {
    if (extras.length >= EXTRA.length) return;
    const [name, flip] = EXTRA[extras.length];
    const d = { name, flip, count: 0, fold: false, timer: null };
    extras.push(d); scheduleExtra(d); render();
  });
  $("btnRemove").addEventListener("click", () => {
    const d = extras.pop(); if (d) clearTimeout(d.timer); render();
  });
  $("langKo").addEventListener("click", () => { lang = "ko"; try { localStorage.setItem("fc-demo-lang", lang); } catch (e) {} render(); seedChat(); });
  $("langEn").addEventListener("click", () => { lang = "en"; try { localStorage.setItem("fc-demo-lang", lang); } catch (e) {} render(); seedChat(); });

  // 채팅 흉내
  const names = ["minsu", "folder_fan", "Jin", "techguy", "yuna_k", "alex"];
  function chatLine(i) { const t = T(); return `<span><b>${names[i % names.length]}</b>${t.chat[i % t.chat.length].replace("{n}", count)}</span>`; }
  let chatIdx = 0;
  function seedChat() { $("chat").innerHTML = [0, 1, 2].map(chatLine).join(""); chatIdx = 3; }
  function bumpChat() { if (count % 3 !== 0) return; const c = $("chat"); c.insertAdjacentHTML("beforeend", chatLine(chatIdx++)); while (c.children.length > 5) c.removeChild(c.firstChild); }

  // 방송 화면 이미지 / 로고 입히기 (이 페이지 안에서만 사용)
  $("bgFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader(); r.onload = () => { $("bgimg").style.backgroundImage = `url(${r.result})`; }; r.readAsDataURL(f);
  });
  $("btnBgReset").addEventListener("click", () => { $("bgimg").style.backgroundImage = ""; $("ovLogo").hidden = true; $("ovLogo").src = ""; });
  $("logoFile").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement("canvas"); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
      const ctx = cv.getContext("2d"); ctx.drawImage(img, 0, 0);
      const id = ctx.getImageData(0, 0, cv.width, cv.height), px = id.data;
      for (let i = 0; i < px.length; i += 4) { const g = px[i + 1] - Math.max(px[i], px[i + 2]); if (g > 60) px[i + 3] = 0; else if (g > 20) px[i + 3] = Math.round(px[i + 3] * (1 - (g - 20) / 40)); }
      ctx.putImageData(id, 0, 0);
      $("ovLogo").src = cv.toDataURL("image/png"); $("ovLogo").hidden = false;
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  });

  // 처음부터 폰 3대가 보이도록
  for (let i = 0; i < 2; i++) { const [name, flip] = EXTRA[i]; const d = { name, flip, count: 3 + i * 2, fold: false, timer: null }; extras.push(d); scheduleExtra(d); }
  seedChat(); render();
})();
</script>
